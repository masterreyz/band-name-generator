<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Band Name Generator</title>
    
    <!-- PyScript Core Terbaru (Mendukung Input Terminal Langsung Tanpa Pop-up) -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            font-size: 20px;
        }
        
        .run-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 5px 15px;
            font-size: 20px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border-radius: 3px;
            margin: 0 5px;
        }

        .header-text {
            color: #00ff00;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="header-text">
        Click <button class="run-btn" onclick="location.reload()">Run</button> to run the final project you will build.
    </div>

    <!-- Script type="py" dengan atribut "terminal" akan membuat terminal asli di layar -->
    <script type="py" terminal>
print("Welcome to the Band Name Generator.")
city = input("What's the name of the city you grew up in?\n")
pet = input("What's your pet's name?\n")
print("Your band name could be " + city + " " + pet)
    </script>

</body>
</html>
